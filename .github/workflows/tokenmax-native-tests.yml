name: tokenmax-native-tests

# Real test coverage for TokenMax's native code (packages/opencode/src/tokenmax/),
# separate from tokenmax-desktop-e2e.yml (which is specifically the R0
# Desktop install/launch/uninstall gate). This workflow grows alongside the
# roadmap (docs/TOKENMAX-ROADMAP.md) as R1 and later phases land more native
# code -- unlike the Desktop E2E, this doesn't need a full Windows runner or
# a package/install cycle, so it runs fast on every relevant push.

on:
  workflow_dispatch:
  push:
    branches:
      - tokenmax-rebuild/main
    paths:
      - ".github/workflows/tokenmax-native-tests.yml"
      - "packages/opencode/src/tokenmax/**"
      - "packages/opencode/test/tokenmax/**"
      - "packages/opencode/src/provider/**"
      - "packages/opencode/src/config/**"
      - "packages/opencode/src/tool/task.ts"
      - "packages/opencode/src/tool/registry.ts"
      - "packages/opencode/test/tool/task.test.ts"
      - "packages/opencode/src/cli/cmd/tokenmax.ts"
      - "packages/opencode/src/effect/app-runtime.ts"
      - "packages/opencode/src/session/run-state.ts"
      - "packages/opencode/src/effect/runner.ts"
      - "packages/opencode/test/session/run-state.test.ts"
      - "packages/opencode/src/tokenmax/completion-gate.ts"
      - "packages/opencode/test/tokenmax/completion-gate.test.ts"
      - "packages/opencode/src/server/routes/instance/httpapi/groups/tokenmax.ts"
      - "packages/opencode/src/server/routes/instance/httpapi/handlers/tokenmax.ts"
      - "packages/opencode/src/server/routes/instance/httpapi/api.ts"
      - "packages/opencode/src/server/routes/instance/httpapi/server.ts"
      - "packages/opencode/test/server/httpapi-tokenmax.test.ts"
      - "packages/desktop/src/main/channel.ts"
      - "packages/desktop/src/main/channel.test.ts"
      - "packages/desktop/src/main/constants.ts"
      - "packages/desktop/src/main/index.ts"
      - "packages/desktop/electron-builder.config.ts"
      - "packages/desktop/electron-builder.config.test.ts"

concurrency:
  group: tokenmax-native-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: TokenMax native tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run TokenMax native tests
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/tokenmax/
        timeout-minutes: 10

      - name: Run TaskTool integration tests (TokenMax router wiring)
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/tool/task.test.ts
        timeout-minutes: 10

      - name: Run R0 regression pass (prompt loop unaffected by router changes)
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/session/prompt.test.ts -t "R0 regression"
        timeout-minutes: 10

      - name: Run SessionRunState tests (R2.5 regression 3.6 coverage)
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/session/run-state.test.ts
        timeout-minutes: 10

      - name: Run TokenMax HTTP API tests (opencode tokenmax's HTTP equivalent)
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/server/httpapi-tokenmax.test.ts
        timeout-minutes: 10

      - name: Typecheck (packages/opencode)
        working-directory: packages/opencode
        run: bun run typecheck
        timeout-minutes: 10

  desktop-unit-tests:
    name: Desktop side-by-side identity unit tests (fast, no Windows/Electron runtime needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run channel/XDG isolation tests (docs/TOKENMAX-RELIABILITY.md's "shared writable database" anti-pattern)
        working-directory: packages/desktop
        run: bun test --timeout 30000 src/main/channel.test.ts
        timeout-minutes: 10

      - name: Run electron-builder config tests (per-channel app id / product name / protocol)
        working-directory: packages/desktop
        run: bun test --timeout 30000 electron-builder.config.test.ts
        timeout-minutes: 10
