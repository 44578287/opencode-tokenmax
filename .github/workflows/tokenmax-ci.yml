name: tokenmax-ci

on:
  push:
    branches:
      - tokenmax/main
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tokenmax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun turbo typecheck

  test:
    name: test (${{ matrix.os }})
    # Upstream flakes on github-hosted runners (not TokenMax):
    # - ubuntu: packages/opencode/test/cli/run/run-process.test.ts timing <15000
    # - windows: bun install ENOTEMPTY applying patches/@ai-sdk/openai-compatible
    # Required gates are typecheck + desktop-windows.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run unit tests
        timeout-minutes: 20
        run: bun turbo test
        env:
          GITHUB_ACTIONS: "false"
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

  tokenmax-tests:
    name: tokenmax-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run TokenMax tests
        working-directory: packages/opencode
        run: bun test test/tokenmax
      - name: First-turn stall regression
        working-directory: packages/opencode
        run: bun test test/tokenmax/first-turn.test.ts test/tokenmax/empty-completion.test.ts
      - name: Run TokenMax Dev isolation tests
        working-directory: packages/desktop
        run: bun test src/main/profile.test.ts electron-builder.config.test.ts

  desktop-windows:
    name: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Prepare desktop
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_CHANNEL: dev
      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: dev
      - name: Package Windows (unsigned)
        working-directory: packages/desktop
        run: npx electron-builder --win --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: dev
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Scan bundle for bun:sqlite
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $hits = @()
          Get-ChildItem -Recurse -Include *.js out/main, ../opencode/dist/node -ErrorAction SilentlyContinue | ForEach-Object {
            if (Select-String -LiteralPath $_.FullName -Pattern "bun:sqlite" -SimpleMatch -Quiet) { $hits += $_.FullName }
          }
          if ($hits.Count -gt 0) { throw "bun:sqlite leaked into $($hits -join ', ')" }
          Write-Host "No bun:sqlite in Electron/Node bundles"
      - name: Upload Windows Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-tokenmax-dev-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 14
      - name: Windows install/launch E2E
        working-directory: packages/desktop
        shell: pwsh
        run: ./scripts/windows-install-e2e.ps1
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-tokenmax-dev-windows-e2e
          path: packages/desktop/dist/e2e-report.json
          if-no-files-found: warn
          retention-days: 14
