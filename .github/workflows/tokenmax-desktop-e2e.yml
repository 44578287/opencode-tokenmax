name: tokenmax-desktop-e2e

# Real Windows Desktop E2E for TokenMax's R0 gate (master brief section 45,
# docs/TOKENMAX-RELIABILITY.md). This is deliberately separate from the
# existing `test`/`publish` workflows: it packages THREE channels (the real
# official "prod" identity, the "dev" pre-release channel, and TokenMax
# Dev), actually installs prod + TokenMax Dev side by side (the
# authoritative pair -- "prod" is the real official OpenCode identity, not
# "dev"), verifies their identities never collide, launches and exits each
# one, uninstalls TokenMax Dev, and re-verifies prod is untouched
# throughout; it then repeats the same sequence for dev + TokenMax Dev as
# secondary, additional coverage -- see
# packages/desktop/scripts/e2e/windows-e2e.ps1 for the full,
# assertion-by-assertion sequence.
#
# Both jobs run on a 3-way matrix ("attempt": 1/2/3), each an independent,
# clean Windows runner building and testing the same commit -- an R0
# confidence gate, not flake-tolerant retries: every attempt must pass on
# its own.
#
# `workflow_dispatch` is the intended trigger long-term (R0 verification
# infrastructure, not a required check on every push). It's also gated on
# `push` to this branch for now: GitHub only lets workflow_dispatch target a
# workflow that already exists on the repo's default branch, and this one
# deliberately doesn't merge to `dev` -- see docs/TOKENMAX-DECISIONS.md.
# Remove the `push` trigger once this is merged and can be workflow_dispatch'd.

on:
  workflow_dispatch:
  push:
    branches:
      - tokenmax-rebuild/main
    paths:
      - ".github/workflows/tokenmax-desktop-e2e.yml"
      - "packages/desktop/**"
      - "packages/opencode/test/session/prompt.test.ts"

concurrency:
  group: tokenmax-desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r0-regression:
    name: R0 regression pass (packages/opencode, Windows, attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    # Standard GitHub-hosted runner, not the blacksmith-4vcpu-windows-2025
    # label test.yml/publish.yml use: jobs queued against that label sat
    # queued indefinitely here with zero contention (no other run in
    # progress), which points at a runner-group/connectivity issue outside
    # GitHub Actions' own scheduler rather than genuine capacity contention.
    # windows-2025 is what publish.yml's own arm64 matrix leg already uses
    # successfully in this repo.
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run TokenMax R0 regression tests
        working-directory: packages/opencode
        run: bun test test/session/prompt.test.ts -t "R0 regression"
        timeout-minutes: 15

  desktop-e2e:
    name: Windows Desktop E2E (prod+TokenMax Dev authoritative, dev+TokenMax Dev secondary, attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    # Standard GitHub-hosted runner, not the blacksmith-4vcpu-windows-2025
    # label test.yml/publish.yml use: jobs queued against that label sat
    # queued indefinitely here with zero contention (no other run in
    # progress), which points at a runner-group/connectivity issue outside
    # GitHub Actions' own scheduler rather than genuine capacity contention.
    # windows-2025 is what publish.yml's own arm64 matrix leg already uses
    # successfully in this repo.
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run Windows Desktop E2E
        run: ./scripts/e2e/windows-e2e.ps1 -DesktopDir "${{ github.workspace }}\packages\desktop"
        working-directory: packages/desktop
        timeout-minutes: 45
